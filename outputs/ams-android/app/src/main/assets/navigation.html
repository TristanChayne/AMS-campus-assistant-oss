@media(prefers-reduced-motion:no-preference){#sheet.closing{animation:sheet-dismiss 180ms cubic-bezier(.2,0,0,1) forwards}#sheet.closing::backdrop{animation:sheet-shade-dismiss 180ms cubic-bezier(.2,0,0,1) forwards}@keyframes sheet-dismiss{from{opacity:1;transform:translate3d(0,0,0)}to{opacity:0;transform:translate3d(0,6px,0)}}@keyframes sheet-shade-dismiss{from{opacity:1}to{opacity:0}}}

.appearance-dropdown{margin-bottom:14px;border:1px solid var(--line);border-radius:14px;background:#fafbfd;overflow:hidden}
.appearance-dropdown .settings-row{border:0;margin:0;background:transparent;cursor:pointer;list-style:none}
.appearance-dropdown summary::-webkit-details-marker{display:none}
.appearance-dropdown summary>span:last-child{display:flex;align-items:center;gap:10px;color:var(--pencil);font-size:13px}
.appearance-chevron{display:inline-block;transition:transform 180ms ease}.appearance-dropdown[open] .appearance-chevron{transform:rotate(90deg)}
.appearance-menu{padding:4px 8px 8px;border-top:1px solid var(--line)}
.appearance-menu button{width:100%;min-height:44px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;border-radius:8px;font-size:13px;text-align:left}
.appearance-check{visibility:hidden}.appearance-menu button[aria-pressed=true]{background:var(--lecture-wash);color:var(--room-blue)}.appearance-menu button[aria-pressed=true] .appearance-check{visibility:visible}
html.ams-dark .appearance-dropdown{background:#20262f}html.ams-dark .appearance-menu button[aria-pressed=true]{background:#303b49;color:#e4e9f0}
@media(prefers-reduced-motion:no-preference){.appearance-dropdown[open] .appearance-menu{animation:appearance-unfold 180ms ease-out}@keyframes appearance-unfold{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}}

@media(prefers-reduced-motion:no-preference){#sheet[open]{will-change:transform,opacity}#sheet[open]::backdrop{will-change:opacity}}

/* Extend the same page surface through the navigation and system-bar areas. */
nav,html.ams-dark nav{background:var(--paper);backdrop-filter:none;border-top-color:transparent}

:root{--system-top:0px;--system-bottom:0px}
.app{padding-top:calc(24px + var(--system-top));padding-bottom:calc(96px + var(--system-bottom))}
.focused-flow{padding-bottom:calc(28px + var(--system-bottom))}
nav{padding:8px 12px calc(4px + var(--system-bottom))}
nav button{min-height:44px}
#sheet{max-height:calc(100dvh - var(--system-top) - var(--system-bottom) - 24px);overflow-y:auto}
.map-toolbar{padding-top:calc(8px + var(--system-top))}.map-controls{padding-bottom:calc(8px + var(--system-bottom))}




/* Floating light navigation; content-only edge feedback is handled separately. */
:root{--nav-glass:#f8faffee;--nav-edge:#ffffffcc;--nav-shadow:#172e6124}
html.ams-dark{--nav-glass:#20262fee;--nav-edge:#ffffff18;--nav-shadow:#00000060}
nav,html.ams-dark nav{width:min(calc(100% - 48px),400px);bottom:calc(4px + var(--system-bottom));padding:12px 10px;border-radius:24px;background:var(--nav-glass);border:1px solid var(--nav-edge);box-shadow:0 6px 22px var(--nav-shadow),inset 0 1px 0 var(--nav-edge);z-index:20}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--nav-glass:#f8faffba}html.ams-dark{--nav-glass:#20262fbf}nav,html.ams-dark nav{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}}
/* Compact daily pass shortcuts, aligned with the approved home preview. */
/* 44x48 / 44x48 / 44x44 touch targets with 8px gaps, matching the iOS layout; the title keeps clear of them. */
.home-layout header{position:relative;padding-right:156px;min-height:65px}
.home-layout .eyebrow{font-size:9px;letter-spacing:1.25px}
.home-layout #xjCodeBtn,.home-layout #hhtCodeBtn{position:absolute;top:13px;width:44px;height:48px;display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;padding:5px 0;margin:0;border-radius:9px;background:transparent}
.home-layout #xjCodeBtn{right:104px}.home-layout #hhtCodeBtn{right:52px}
.home-layout #xjCodeBtn svg,.home-layout #hhtCodeBtn svg{width:22px;height:22px}
.home-layout #xjCodeBtn span,.home-layout #hhtCodeBtn span{font-size:10px;font-weight:550;color:var(--pencil);line-height:1.2}
.home-layout #settingsBtn{position:absolute;right:0;top:15px;width:44px;height:44px}
/* Sports keep-alive (Android settings): switch plus 3 / 5 / 7 day segments, 48px touch targets. */
.keepalive-section .keepalive-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.keepalive-section h2{margin:0 0 4px}
.keepalive-switch{flex:0 0 auto;position:relative;width:52px;height:48px;border:0;background:transparent;padding:0;cursor:pointer}
.keepalive-switch span{position:absolute;left:0;top:10px;width:52px;height:28px;border-radius:14px;background:var(--line);transition:background 160ms ease}
.keepalive-switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:transform 160ms ease}
.keepalive-switch[aria-checked="true"] span{background:var(--campus-blue)}
.keepalive-switch[aria-checked="true"] span::after{transform:translateX(24px)}
.keepalive-days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 4px}
.keepalive-days button{min-height:48px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--pencil);font-size:14px}
.keepalive-days button[aria-pressed="true"]{background:var(--lecture-wash);border-color:transparent;color:var(--campus-blue);font-weight:600}
@media(prefers-reduced-motion:reduce){.keepalive-switch span,.keepalive-switch span::after{transition:none}}
html.ams-dark .keepalive-days button[aria-pressed="true"]{background:#303b49;color:#e4e9f0}
html.ams-dark .keepalive-switch[aria-checked="true"] span{background:#5b7bb8;background:color-mix(in srgb,var(--campus-blue) 55%,#fff)}
/* Course reminder (REMIND-001, D-021): one settings entry, a grouped page with sub-pages; reuses the keep-alive switch. */
.reminder-entry{text-align:left}
.reminder-entry-title{display:flex;flex-direction:column;gap:2px;min-width:0}
.reminder-entry-title small{font-size:12px;color:var(--pencil);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reminder-entry-value{display:flex;align-items:center;gap:10px;flex:none;color:var(--pencil);font-size:13px}
.reminder-warn{color:#a15b46}
.reminder-group-title{font-size:12px;font-weight:600;color:var(--pencil);margin:20px 4px 8px}
.reminder-group{padding-top:6px;padding-bottom:6px}
.reminder-group .keepalive-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:8px 0}

.reminder-group>*+*{border-top:1px solid var(--line)}

.reminder-item .form-help{margin-top:2px}
.reminder-page-help{margin:0 4px 8px}
.reminder-option{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;padding:0;border-radius:0;background:transparent;color:var(--ink);font-size:14px;text-align:left}
.reminder-option span:last-child{color:var(--pencil);font-size:13px}
.reminder-option[aria-pressed="true"] span:last-child{color:var(--campus-blue);font-weight:600}
.reminder-intro{background:var(--lecture-wash);border-color:transparent}
.reminder-intro h2{margin:0 0 4px}.reminder-intro .form-submit{margin-top:14px}
.reminder-locked,.reminder-dim{opacity:.45}
.reminder-locked{pointer-events:none}
.reminder-dim .reminder-group button:disabled{cursor:default}
.reminder-blocked h2{color:var(--pencil)}
html.ams-dark .reminder-intro{background:#303b49}html.ams-dark .reminder-warn{color:#efb8a5}
.reminder-link{border:0;background:none;color:var(--campus-blue);padding:0 2px;font:inherit;text-decoration:underline;min-height:0}
.form-submit.reminder-mute{margin-top:16px;width:100%}
.reminder-choice{margin:12px 0}
.reminder-choice h3{margin:0 0 4px;font-size:15px}
.reminder-choice button{width:100%;margin-top:10px}
.reminder-secondary{min-height:48px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--campus-blue);font-size:15px;font-weight:600}
html.ams-dark .reminder-secondary{color:#e4e9f0}
.reminder-skip{display:block;margin:12px auto 0;min-height:44px}
.reminder-first-choice h2{margin:0 0 14px}
.reminder-first-choice>p{margin:0;font-size:14px;line-height:1.7}
.reminder-first-choice>p.form-help{margin-top:12px;font-size:12px;line-height:1.6}
.reminder-first-actions{display:grid;gap:10px;margin-top:20px}
.reminder-first-actions .form-submit{min-height:48px;margin:0;padding:12px 16px}
#close[hidden]{display:none}
