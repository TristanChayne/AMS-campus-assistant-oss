.attendance-card{padding:16px;margin-bottom:12px}.attendance-top{display:grid;grid-template-columns:minmax(0,1fr) 76px;gap:14px;align-items:center}.attendance-top h3{font-size:15px;line-height:1.45;margin:6px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.course-code{font-size:11px;color:var(--pencil)}.attendance-ring{position:relative;width:76px;height:76px;display:grid;place-items:center}.attendance-ring svg{position:absolute;inset:0;width:76px;height:76px;transform:rotate(-90deg)}.attendance-ring circle{fill:none;stroke-width:5;stroke-linecap:round}.attendance-ring .track{stroke:#e7ebf1}.attendance-ring .value{stroke:#4269a3}.attendance-ring.warning .value{stroke:#b57738}.attendance-ring strong{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}.attendance-ring small{font-size:9px;color:var(--pencil);display:block;margin-top:5px;text-align:center}.attendance-stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding-top:13px;margin-top:14px;gap:8px}.attendance-stats strong{font-size:17px;font-weight:600;display:block;font-variant-numeric:tabular-nums}.attendance-stats span{font-size:10px;color:var(--pencil)}.attendance-stats .missed strong{color:#a15b46}.threshold-note{font-size:11px;color:#9b6b35;margin:10px 0 0}

<main class="app">
<header><div><div class="eyebrow">XJTLU / CAMPUS DAY</div><h1>今日课表</h1></div></header>
<div id="homeScreen"><div class="date-head"><strong id="month">2026 年 10 月</strong><button class="return" id="today">回到今天 ↗</button></div>
<div class="week" id="week" aria-label="选择课程日期"></div>
<section id="focus" aria-label="当前或下一节课程"></section>
<div class="actions"><button class="action" id="scanBtn"><svg><use href="#scan"/></svg>扫码签到</button><button class="action" id="codeBtn"><svg><use href="#code"/></svg>Code 签到</button></div>
<section aria-label="课程列表"><div class="section-title"><h2 id="listTitle">接下来的课</h2><span id="count"></span></div><div id="lessons"></div><div id="completed"></div></section>

</div><section id="otherScreen" hidden></section><nav aria-label="主导航"><button class="active" aria-current="page"><svg><use href="#calendar"/></svg>课表</button><button id="records"><svg><use href="#record"/></svg>签到记录</button><button id="leaveBtn"><svg><use href="#leave"/></svg>请假</button></nav>
</main><dialog id="sheet"><div id="sheetContent"></div><button class="close" id="close">关闭</button></dialog>
<script>
const icon=id=>`<svg aria-hidden="true"><use href="#${id}"/></svg>`;
let days=[], selected=0, ready=false,page={route:'/home'},draft='',busy=false,lastRenderedRoute='';
const scrollPositions={};
const screens={};
function navigate(route,action){if(screens[route]){page=screens[route];render();}send(action);}
const mins=t=>Number(t.split(':')[0])*60+Number(t.split(':')[1]);
const escape=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const send=(action,extra={})=>parent.postMessage(Object.assign({amsUiAction:action},extra),'*');
document.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse'&&e.button!==0)return;
 const button=e.target.closest&&e.target.closest('button,summary');if(!button)return;
 const rect=button.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;
 const radius=Math.hypot(Math.max(x,rect.width-x),Math.max(y,rect.height-y));
 const ripple=document.createElement('span');ripple.className='tap-ripple';ripple.setAttribute('aria-hidden','true');
 ripple.style.cssText=`width:${radius*2}px;height:${radius*2}px;left:${x-radius}px;top:${y-radius}px`;
 button.appendChild(ripple);setTimeout(()=>ripple.remove(),400);
});
const rows=()=>days[selected]&&Array.isArray(days[selected].timetableVoList)?days[selected].timetableVoList:[];
function times(c){const matches=String(c.moduleTime||'').match(/\d{1,2}:\d{2}/g);return matches&&matches.length>=2?matches.slice(0,2):null;}
function show(content){document.getElementById('sheetContent').innerHTML=content;document.getElementById('sheet').showModal();}
function detail(i){const c=rows()[i];show(`<h2>${escape(c.moduleTitle)}</h2><dl><dt>时间</dt><dd>${escape(c.moduleTime||'未提供')}</dd><dt>教室</dt><dd>${escape(c.room||'学校暂未提供')}</dd><dt>课程编号</dt><dd>${escape(c.moduleCode||'—')}</dd><dt>教学组</dt><dd>${escape(c.moduleTypeGroup||'—')}</dd></dl>`);}
function card(c,i,ended=false){const t=times(c);const now=new Date();const n=now.getHours()*60+now.getMinutes();const state=ended?'已结束':selected===0&&t&&mins(t[0])<=n&&n<mins(t[1])?'进行中':'待上课';return `<article class="lesson"><div class="times">${escape(t?t[0]:'—')}<small>${escape(t?t[1]:'')}</small></div><button class="card" data-detail="${i}" aria-label="查看课程详情"><div class="card-top"><span>${escape(c.moduleCode||'')}</span><span class="state">${t?state:'时间待确认'}</span></div><h3>${escape(c.moduleTitle||'未命名课程')}</h3><div class="room">${icon('pin')}${escape(c.room||'地点待确认')}<span class="arrow">›</span></div></button></article>`;}
function renderHome(){const now=new Date(),n=now.getHours()*60+now.getMinutes();document.getElementById('month').textContent=now.getFullYear()+' 年 '+(now.getMonth()+1)+' 月';document.getElementById('week').innerHTML=[0,1,2].map(i=>`<button class="day ${selected===i?'selected':''}" data-date="${i}" aria-pressed="${selected===i}"><small>${['今天','明天','后天'][i]}</small><b>${escape(days[i]&&days[i].date&&days[i].date.trim()!=='-'?days[i].date:'待读取')}</b></button>`).join('');let all=rows().map((c,i)=>({c,i}));all.sort((a,b)=>{const x=times(a.c),y=times(b.c);return (x?mins(x[0]):Infinity)-(y?mins(y[0]):Infinity);});const valid=ready&&days[selected]&&days[selected].date&&days[selected].date.trim()!=='-'&&Array.isArray(days[selected].timetableVoList);const ended=selected===0?all.filter(x=>times(x.c)&&mins(times(x.c)[1])<=n):[];const remaining=all.filter(x=>!ended.includes(x));const next=remaining.find(x=>times(x.c));const t=next&&times(next.c);const active=selected===0&&t&&mins(t[0])<=n&&n<mins(t[1]);document.getElementById('focus').innerHTML=next?`<div class="hero"><div class="hero-top"><span>${active?'正在上课':selected===0?'下一节课':'当天第一节课'}</span><span>${selected===0?(active?'还有 '+(mins(t[1])-n)+' 分钟结束':(mins(t[0])-n)+' 分钟后开始'):escape(days[selected].date)}</span></div><h2>${escape(next.c.moduleTitle)}</h2><div class="hero-time">${escape(t[0])} — ${escape(t[1])}</div><div class="destination">${icon('pin')}<b>${escape(next.c.room||'地点待确认')}</b><span>上课地点</span></div>${active?`<div class="bar"><i style="width:${(n-mins(t[0]))/(mins(t[1])-mins(t[0]))*100}%"></i></div>`:''}</div>`:'';document.getElementById('listTitle').textContent=selected===0?'接下来的课':['今天','明天','后天'][selected]+'课程';document.getElementById('count').textContent=valid?all.length+' 节课'+(selected===0?' · 剩余 '+remaining.length+' 节':''):'尚未读取';document.getElementById('lessons').innerHTML=remaining.length?remaining.map(x=>card(x.c,x.i)).join(''):`<div class="empty">${icon('calendar')}<h2>${!valid?'正在读取学校课表':all.length?'今天的课都结束了':'当天没有课程'}</h2><p>${!valid?'暂未获取到数据，不代表当天没有课。':all.length?'今天辛苦了。':'学校返回的课表为空。'}</p></div>`;document.getElementById('completed').innerHTML=ended.length?`<details class="completed"><summary>今天已结束 · ${ended.length} 节课</summary>${ended.map(x=>card(x.c,x.i,true)).join('')}</details>`:'';document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.date);render();});document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(Number(b.dataset.detail)));}

const leaveTypeLabel=s=>({Illness:'病假',Medical:'医疗原因','Medical Leave':'病假','Sick Leave':'病假','Personal Leave':'事假','Personal Reasons':'个人原因',Personal:'事假','Compassionate Leave':'丧假',Bereavement:'丧假',Other:'其他',Others:'其他','Other Reasons':'其他原因'}[s]||s);
function toast(text){let el=document.getElementById('appToast');if(!el){el=document.createElement('div');el.id='appToast';el.className='app-toast';el.setAttribute('role','status');document.body.appendChild(el);}el.textContent=text;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.remove(),3200);}
function attendanceCard(c,i){const number=Number(c.courseAttendance),valid=c.courseAttendance!==null&&c.courseAttendance!==undefined&&c.courseAttendance!==''&&Number.isFinite(number)&&number>=0&&number<=100,warning=c.courseThresholdFlag===true||c.courseThresholdFlag===1||c.courseThresholdFlag==='1',percent=valid?number+'%':'—';return `<button class="card attendance-card" data-record="${i}" aria-label="${escape(c.moudleTitle||c.moduleTitle)}，出勤率 ${escape(percent)}，查看明细"><div class="attendance-top"><div><span class="course-code">${escape(c.moduleCode)}</span><h3>${escape(c.moudleTitle||c.moduleTitle)}</h3></div><div class="attendance-ring ${warning?'warning':''}"><svg viewBox="0 0 80 80" aria-hidden="true"><circle class="track" cx="40" cy="40" r="34"/><circle class="value" cx="40" cy="40" r="34" stroke-dasharray="${valid?number/100*213.63:0} 213.63"/></svg><div><strong>${escape(percent)}</strong><small>出勤率</small></div></div></div><div class="attendance-stats">${[['总课时',c.classHour],['已出勤',c.signClassHour],['缺勤',c.absences],['请假',c.leaveClassHour]].map(([label,value])=>`<div class="${label==='缺勤'&&Number(value)>0?'missed':''}"><strong>${escape(value==null?'—':value)}</strong><span>${label}</span></div>`).join('')}</div>${warning?'<p class="threshold-note">学校出勤预警 · 查看明细</p>':''}</button>`;}
function localDate(value){if(!value)return '';const d=new Date(value);if(Number.isNaN(d.getTime()))return '';return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function renderLeaveForm(screen){const f=page.form||{},files=f.fileList||[],uploading=files.some(x=>x.status==='uploading');screen.innerHTML=`<button class="return" id="leaveBack">‹ 返回请假</button><p class="form-notice">填写申请后由学校审核。<button id="leaveGuide">填写说明</button></p><section class="form-section"><h2>请假安排</h2><div class="date-pair"><label class="field">开始日期 *<input id="leaveStart" type="date" min="${escape(localDate(page.minStart))}" max="${escape(localDate(page.maxStart))}" value="${escape(f.startDate||'')}"></label><label class="field">结束日期 *<input id="leaveEnd" type="date" min="${escape(localDate(page.minEnd))}" max="${escape(localDate(page.maxEnd))}" value="${escape(f.endDate||'')}"></label></div><p class="form-help">${f.startDate&&f.endDate?'共 '+escape(page.leaveDays)+' 天':'日期范围由学校提供'}</p><label class="field">请假类型 *<select id="leaveType"><option value="">请选择</option>${(page.leaveTypes||[]).map(t=>`<option value="${escape(t)}" ${f.leaveType===t?'selected':''}>${escape(leaveTypeLabel(t))}</option>`).join('')}</select></label><label class="field">涉及课程 *<button class="select-sessions" id="chooseLeaveCourses">${Number(page.selectedCount)>0?'已选择 '+page.selectedCount+' 节课':'选择需要请假的课程'} ›</button></label></section><section class="form-section"><h2>原因与证明</h2><label class="field">请假原因 *<textarea id="leaveReason" maxlength="500" placeholder="请说明请假原因">${escape(f.leaveReason||'')}</textarea></label><p class="form-help" id="reasonCount">${String(f.leaveReason||'').length}/500</p><label class="field">证明附件 *<span class="file-picker">${icon('record')}<span>${uploading?'正在上传…':files.length?'重新选择附件':'选择证明文件'}</span><input id="leaveFile" type="file" accept=".jpg,.jpeg,.png,.pdf,.zip,.rar" ${uploading?'disabled':''}></span></label><p class="form-help">支持 JPG、PNG、PDF、ZIP、RAR，单个文件不超过 10 MB。</p>${files.length?`<div class="file-row">${escape(files[0].originalFileName||files[0].name||'证明文件')} · ${uploading?'上传中':files[0].status==='failed'?'上传失败，请重新选择':'已上传'}<button id="removeLeaveFile" ${uploading?'disabled':''}>移除</button></div>`:''}</section><button class="form-submit" id="submitLeave" ${uploading||page.submitting?'disabled':''}>${page.submitting?'正在提交…':'提交请假申请'}</button><p class="form-help">请核对日期、课程和附件，提交后以学校审核结果为准。</p>`;
 document.getElementById('leaveBack').onclick=()=>navigate('/leave','leave');
 document.getElementById('leaveGuide').onclick=()=>show('<h2>填写说明</h2><p>先选择日期和请假类型，再选择涉及的课程。日期变更后需要重新选择课程。</p><p>填写真实原因并上传证明文件。可选日期、课程额度和最终审核均以学校规则为准。</p><button class="close" id="schoolGuide">查看学校完整指南</button>');
 screen.querySelector('#leaveGuide').addEventListener('click',()=>{const b=document.getElementById('schoolGuide');if(b)b.onclick=()=>{document.getElementById('sheet').close();send('leaveGuide');};});
 for(const [id,field] of [['leaveStart','startDate'],['leaveEnd','endDate'],['leaveType','leaveType']])document.getElementById(id).onchange=e=>send('leaveField',{field,value:e.target.value});
 document.getElementById('leaveReason').oninput=e=>{page.form.leaveReason=e.target.value;document.getElementById('reasonCount').textContent=e.target.value.length+'/500';send('leaveField',{field:'leaveReason',value:e.target.value});};
 document.getElementById('chooseLeaveCourses').onclick=()=>send('chooseLeaveCourses');
 document.getElementById('leaveFile').onchange=e=>{const file=e.target.files[0];if(file)send('uploadLeaveFile',{file});};
 const remove=document.getElementById('removeLeaveFile');if(remove)remove.onclick=()=>send('removeLeaveFile');
 document.getElementById('submitLeave').onclick=()=>send('submitLeave');
}
function renderLeaveCourses(screen){const days=page.leaveCourseDays||[],selected=page.courseSelected||[],courses=days.flatMap(d=>(d.leaveModuleList||[]));screen.innerHTML='<button class="return" id="leaveFormBack">‹ 返回申请</button>'+`<p class="form-help">${escape(page.dateRange||'')} · 选择涉及的课程</p><div class="choice-footer"><span>已选 ${selected.length} 节课</span><button id="selectAllLeave">${page.checkedAll?'取消全选':'选择全部可选课程'}</button></div>`+(courses.length?days.map(d=>(d.leaveModuleList||[]).length?`<p class="session-title">${escape(d.date)}</p>`+d.leaveModuleList.map(c=>`<label class="course-choice ${c.disabled&&!c.courseBox?'disabled':''}"><input type="checkbox" data-leave-course="${escape(c.moduleCodeId)}" ${c.courseBox?'checked':''} ${c.disabled&&!c.courseBox?'disabled':''}><div><h3>${escape(c.moduleTitle)}</h3><p>${escape(c.moduleTypeGroup)}</p><p>${escape(c.time)}</p>${c.courseTipOne?'<p class="course-warning">已达到本次申请的课程请假额度</p>':''}${c.courseTipTwo?'<p class="course-warning">已达到本学期的课程请假额度</p>':''}</div></label>`).join(''):'').join(''):`<div class="empty-state"><h2>${page.coursesReady?'这段时间没有可选课程':'正在读取可选课程'}</h2><p>课程范围和可选状态由学校提供</p></div>`)+`<button id="confirmLeaveCourses" class="form-submit">确认 ${selected.length} 节课</button>`;
 document.getElementById('leaveFormBack').onclick=()=>send('backLeaveForm');
 document.getElementById('selectAllLeave').onclick=()=>send('selectAllLeave');
 document.getElementById('confirmLeaveCourses').onclick=()=>send('confirmLeaveCourses');
 screen.querySelectorAll('[data-leave-course]').forEach(b=>b.onchange=()=>send('toggleLeaveCourse',{id:b.dataset.leaveCourse,checked:b.checked}));

function render(){
 const route=page.route||'/home',home=route==='/home';
 const changed=lastRenderedRoute!==route;if(changed){if(lastRenderedRoute)scrollPositions[lastRenderedRoute]=window.scrollY;lastRenderedRoute=route;if(document.getElementById('sheet').open)document.getElementById('sheet').close();}
 document.getElementById('homeScreen').hidden=!home;
 document.getElementById('otherScreen').hidden=home;
 document.querySelector('h1').textContent=home?'今日课表':route.startsWith('/course')?'签到记录':route==='/leaveApplication'?'请假申请':route==='/leaveCourse'?'选择课程':route==='/leave'?'请假':route==='/signCode'?'Code 签到':'签到结果';
 document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',i===(route.startsWith('/course')?1:route.startsWith('/leave')?2:0)));
 if(changed){window.scrollTo(0,scrollPositions[route]||0);const panel=document.getElementById(home?'homeScreen':'otherScreen');panel.classList.remove('screen-enter');void panel.offsetWidth;panel.classList.add('screen-enter');panel.onanimationend=()=>panel.classList.remove('screen-enter');}
 document.querySelectorAll('nav button').forEach(b=>{if(b.classList.contains('active'))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
 if(home){renderHome();return;}
 const list=page.list||[],screen=document.getElementById('otherScreen');
 const back='<button class="return" id="backHome">‹ 返回课表</button>';
 if(route==='/signCode')screen.innerHTML=back+`<div class="hero"><h2>输入课堂签到码</h2><p>提交后由学校验证，以返回结果为准。</p></div><form id="codeForm"><label for="codeValue">签到码</label><input id="codeValue" autocomplete="off" maxlength="20" required value="${escape(draft)}" placeholder="输入老师提供的 code" style="margin:12px 0"><button class="close" ${busy?'disabled':''}>${busy?'正在提交…':'提交签到'}</button></form>`;
 else if(route==='/course')screen.innerHTML=(page.loading?'<p class="load-note">正在读取学校记录…</p>':'')+list.map(attendanceCard).join('')+(!page.loading&&!list.length?'<div class="empty-state"><h2>暂无签到记录</h2><p>学校返回的课程记录为空</p></div>':'');
 else if(route==='/leaveApplication')renderLeaveForm(screen);
 else if(route==='/leaveCourse')renderLeaveCourses(screen);
 else if(route==='/course/sessions'){
  const q=page.query||{},names=['待确认','已出勤','缺勤','已批准请假','不计入'];
  screen.innerHTML='<button class="return" id="backRecords">‹ 全部课程</button>'+`<p class="session-title">${escape(q.moduleCode||'课程')} · 出勤明细</p><div class="record-filters"><label>教学组<select id="groupFilter"><option value="">全部教学组</option>${(page.groups||[]).map(g=>`<option value="${escape(g.name)}" ${q.moduleTypeGroup===g.name?'selected':''}>${escape(g.name)}</option>`).join('')}</select></label><label>出勤状态<select id="statusFilter"><option value="">全部状态</option>${names.map((n,i)=>`<option value="${i}" ${String(q.status)===String(i)?'selected':''}>${n}</option>`).join('')}</select></label><label class="date-filter">上课日期<input type="date" id="dateFilter" value="${escape(q.date==='Time'?'':q.date||'')}"></label></div>`+list.map(c=>`<article class="session"><div class="session-head"><h3>${escape(c.moduleTypeGroup||q.moduleCode)}</h3><span class="badge ${Number(c.status)===1?'present':Number(c.status)===2?'absent':''}">${escape(names[Number(c.status)]||c.statusName||'待确认')}</span></div><p class="session-date">${escape(c.date)}</p><div class="session-foot"><span>${Number(c.status)===1?'签到于 '+escape(c.signTime||'—'):''}</span><span>${escape(({1:'扫码签到',2:'Code 签到',3:'教师确认',6:'未签到',7:'未签到'})[c.signWay]||'')}</span></div></article>`).join('')+(page.loading?'<p class="load-note">正在读取明细…</p>':!list.length?'<div class="empty-state"><h2>没有匹配的记录</h2><p>试试调整筛选条件</p></div>':!page.finished?'<button class="action" id="moreSessions" style="width:100%">加载更多</button>':'<p class="load-note">已显示全部记录</p>');
 }
 else if(route==='/leave')screen.innerHTML='<button class="action" id="applyLeave" style="width:100%;margin-bottom:20px">＋ 新建请假申请</button>'+(page.loading?'<p class="load-note">正在读取请假记录…</p>':'')+list.map((c,i)=>`<button class="card" data-leave="${i}" style="margin-bottom:12px"><div class="card-top"><span>${escape(c.leaveOdd)}</span><span>${Number(c.status)===2?'已完成':'待处理'}</span></div><h3>${escape(c.startDate)} 至 ${escape(c.endDate)}</h3><p>创建于 ${escape(c.createTime)}</p></button>`).join('')+(!page.loading&&!list.length?`<div class="empty-state"><div class="empty-symbol">${icon('leave')}</div><h2>暂无请假申请</h2><p>提交的申请会显示在这里</p></div>`:'');
 else if(route==='/signCodeSuccess')screen.innerHTML=back+`<div class="hero"><div class="hero-top">学校已返回签到成功</div><h2>签到成功</h2><p>${escape(page.signInfo&&page.signInfo.signTime||'')}</p></div>`;
 else if(route==='/signCodeFail')screen.innerHTML=back+`<div class="card"><h3>签到未成功</h3><p>${escape(page.reason||'请检查学校返回的信息')}</p><button class="close" id="retryCode">重新输入 code</button></div>`;
 else screen.innerHTML=back+'<p>正在加载…</p>';
 const backButton=document.getElementById('backHome');if(backButton)backButton.onclick=()=>navigate('/home','home');
 const form=document.getElementById('codeForm');if(form){document.getElementById('codeValue').oninput=e=>draft=e.target.value;form.onsubmit=e=>{e.preventDefault();if(busy||!draft.trim())return;busy=true;send('submitCode',{code:draft.trim()});render();};}
 document.querySelectorAll('[data-record]').forEach(b=>b.onclick=()=>send('recordDetail',{index:Number(b.dataset.record)}));
 document.querySelectorAll('[data-leave]').forEach(b=>b.onclick=()=>send('leaveDetail',{index:Number(b.dataset.leave)}));
 const apply=document.getElementById('applyLeave');if(apply)apply.onclick=()=>send('applyLeave');
 const retry=document.getElementById('retryCode');if(retry)retry.onclick=()=>send('code');
 const recordsBack=document.getElementById('backRecords');if(recordsBack)recordsBack.onclick=()=>navigate('/course','records');
 const more=document.getElementById('moreSessions');if(more)more.onclick=()=>send('moreSessions');
 for(const [id,field] of [['groupFilter','group'],['statusFilter','status'],['dateFilter','date']]){const input=document.getElementById(id);if(input)input.onchange=()=>send('filterSessions',{field,value:input.value});}
}
window.addEventListener('message',e=>{if(e.source!==parent||!e.data||!e.data.amsUiData)return;const data=e.data.amsUiData;
 if(data.notification){toast(data.notification);return;}
 if(data.resetCache){for(const key of Object.keys(screens))delete screens[key];days=[];ready=false;return;}
 if(data.prefetched){for(const [route,snapshot] of Object.entries(data.prefetched))screens[route]=snapshot;return;}
 if(page.route!==data.route)busy=false;page=data;screens[data.route]=data;if(data.days){days=data.days;ready=data.ready;}
 document.getElementById('leaveBtn').hidden=!data.leave;
 const focused=document.activeElement;
 if(data.route==='/leaveApplication'&&focused&&focused.id==='leaveReason')return;
 render();});
document.getElementById('scanBtn').onclick=()=>{
 const bridge=window.AmsCamera;if(bridge&&typeof bridge.open==='function')bridge.open();else send('scan');
};
document.getElementById('codeBtn').onclick=()=>send('code');document.getElementById('records').onclick=()=>navigate('/course','records');document.getElementById('leaveBtn').onclick=()=>navigate('/leave','leave');
document.querySelector('nav button').onclick=()=>navigate('/home','home');document.getElementById('today').onclick=()=>{selected=0;render();};document.getElementById('close').onclick=()=>document.getElementById('sheet').close();setInterval(()=>{if(page.route==='/home'&&!document.getElementById('sheet').open)render();},60000);render();send('ready');
</script><script>window.postMessage({amsUiData:{"route": "/leaveApplication", "form": {"startDate": "2026-10-05", "endDate": "2026-10-06", "leaveType": "Sick Leave", "leaveReason": "", "fileList": []}, "leaveTypes": ["Sick Leave", "Personal Leave", "Other"], "minStart": "2026-09-28", "maxStart": "2026-10-12", "minEnd": "2026-09-28", "maxEnd": "2026-10-12", "leaveDays": 2, "selectedCount": 2, "leave": true}},'*');</script></html>
