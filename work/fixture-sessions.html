<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--campus-blue:#172e61;--paper:#f5f6f8;--ink:#18233a;--room-blue:#254e9b;--pencil:#69758a;--line:#e1e6ed;--lecture-wash:#eaf0fa}*{box-sizing:border-box}body{margin:0;background:#e7ebf1;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink)}button,input{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}button:focus-visible,summary:focus-visible{outline:3px solid #537cb8;outline-offset:3px}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.app{max-width:480px;min-height:100dvh;background:var(--paper);margin:auto;padding:24px 22px 112px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--pencil)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-size:29px;letter-spacing:-1px;margin:5px 0 0;font-weight:750}.preview-tag{font-size:11px;background:#e9edf3;border-radius:6px;padding:6px 9px;color:#53617a}.date-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.date-head strong{font-size:14px}.return{font-size:12px;color:var(--room-blue);padding:9px 0 9px 12px}.week{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:25px}.day{min-height:66px;border-radius:13px;display:flex;align-items:center;flex-direction:column;padding:9px 0;gap:6px}.day small{font-size:11px;color:var(--pencil)}.day b{font-size:17px;line-height:1.1;font-variant-numeric:tabular-nums}.day.selected{background:var(--campus-blue);color:white}.day.selected small{color:#c6d3eb}.day.today:not(.selected){background:var(--lecture-wash)}.day i{width:3px;height:3px;background:currentColor;border-radius:50%}.hero{background:var(--campus-blue);color:white;border-radius:20px;padding:21px 22px;margin-bottom:20px}.hero-top{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#d0dbef}.hero h2{font-size:21px;line-height:1.35;margin:15px 0 12px;font-weight:600}.hero-time{font-size:14px;color:#d0dbef;font-variant-numeric:tabular-nums}.destination{display:flex;align-items:center;gap:8px;margin-top:17px;border-top:1px solid #ffffff25;padding-top:16px}.destination b{font-size:26px;letter-spacing:.5px}.destination span{font-size:12px;color:#c6d3eb;margin-left:auto}.bar{height:3px;background:#ffffff24;border-radius:5px;margin-top:16px;overflow:hidden}.bar i{display:block;height:100%;background:#b6c9ee}.actions{display:grid;grid-template-columns:1.15fr 1fr;gap:10px;margin-bottom:28px}.action{border:1px solid var(--line);background:#fafbfd;border-radius:13px;padding:14px 10px;display:flex;align-items:center;justify-content:center;gap:9px;font-size:14px;font-weight:650;min-height:50px}.action:first-child{color:var(--campus-blue);background:var(--lecture-wash);border-color:transparent}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.section-title h2{font-size:16px;margin:0}.section-title span{font-size:12px;color:var(--pencil)}.lesson{display:grid;grid-template-columns:58px 1fr;gap:12px;margin-bottom:12px}.times{padding-top:17px;font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;text-align:left}.times small{display:block;font-size:12px;color:var(--pencil);font-weight:400;margin-top:4px}.card{width:100%;text-align:left;border:1px solid var(--line);border-radius:15px;background:#fafbfd;padding:16px}.card-top{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:var(--pencil);letter-spacing:.3px}.state{color:var(--room-blue);font-size:11px;letter-spacing:0}.card h3{font-size:16px;line-height:1.4;margin:8px 0 14px;font-weight:650}.room{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700}.room svg{width:17px;height:17px;color:var(--pencil)}.room small{font-weight:400;font-size:10px;color:var(--pencil);margin-left:3px}.room .arrow{margin-left:auto;font-weight:400;font-size:18px;color:var(--pencil)}details.completed{border-top:1px solid var(--line);margin-top:23px;padding-top:17px}summary{cursor:pointer;font-size:13px;color:var(--pencil);padding:5px 0 15px}details.completed .card{background:transparent}details.completed h3{color:#68748a}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);display:grid;grid-template-columns:repeat(3,1fr);padding:13px 12px max(16px,env(safe-area-inset-bottom));background:#f9fafcee;border-top:1px solid var(--line);backdrop-filter:blur(12px)}nav button{display:flex;align-items:center;flex-direction:column;gap:5px;font-size:11px;color:var(--pencil);padding:4px}nav button.active{color:var(--campus-blue);font-weight:700}.empty{text-align:center;padding:40px 15px 55px;color:var(--pencil)}.empty svg{width:40px;height:40px}.empty h2{font-size:19px;color:var(--ink)}.demo{margin-top:32px;padding-top:16px;border-top:1px dashed var(--line);font-size:11px;color:var(--pencil);line-height:1.7}.demo-controls{display:flex;gap:8px;margin-top:10px}.demo-controls button{padding:7px 11px;border-radius:7px;background:#e8edf4;font-size:11px}.demo-controls button[aria-pressed=true]{background:var(--campus-blue);color:white}dialog{border:0;border-radius:20px;padding:24px;width:min(90vw,420px);color:var(--ink);background:#fafbfd}dialog::backdrop{background:#17233a66}dialog h2{font-size:21px;margin-top:0}dialog p{line-height:1.7;color:var(--pencil);font-size:14px}.close{width:100%;border-radius:10px;background:var(--campus-blue);color:white;padding:13px;margin-top:16px}dl{font-size:14px}dt{color:var(--pencil);margin-top:15px;font-size:12px}dd{margin:5px 0 0}input{width:100%;border:1px solid var(--line);border-radius:10px;padding:14px;background:white}@media(max-width:360px){.app{padding-left:16px;padding-right:16px}.hero{padding:18px}.lesson{grid-template-columns:50px 1fr;gap:8px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s}dialog[open]{animation:appear .15s ease-out}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}}

button,summary{-webkit-tap-highlight-color:transparent;touch-action:manipulation;position:relative;isolation:isolate;overflow:hidden}
button:focus-visible,summary:focus-visible{outline:2px solid #537cb8;outline-offset:-3px}
button:focus:not(:focus-visible),summary:focus:not(:focus-visible){outline:none}
button{transition:transform 100ms ease,background 150ms ease}
button:active{transform:scale(.98)}
.tap-ripple{position:absolute;border-radius:50%;background:currentColor;pointer-events:none;opacity:0;transform:scale(0);animation:tap-spread 380ms ease-out;z-index:0}
@keyframes tap-spread{0%{opacity:.16;transform:scale(0)}70%{opacity:.09}100%{opacity:0;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){button{transition:none}button:active{transform:none}.tap-ripple{animation:none}}
.record-filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 18px}.record-filters label{font-size:11px;color:var(--pencil)}.record-filters select,.record-filters input{display:block;width:100%;min-width:0;margin-top:6px;border:1px solid var(--line);border-radius:10px;background:#fafbfd;padding:10px;font:inherit;color:var(--ink);font-size:13px}.record-filters .date-filter{grid-column:1/-1}.session{background:#fafbfd;border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:10px}.session-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.session h3{font-size:14px;line-height:1.45;overflow-wrap:anywhere;margin:0;max-width:72%}.badge{white-space:nowrap;font-size:11px;padding:5px 8px;border-radius:7px;background:#edf0f5;color:#526079}.badge.present{background:#e6f2ed;color:#287053}.badge.absent{background:#faece9;color:#9a463b}.session-date{font-size:14px;margin:13px 0 8px;font-variant-numeric:tabular-nums}.session-foot{font-size:11px;color:var(--pencil);display:flex;justify-content:space-between;gap:8px;line-height:1.6}.empty-state{margin-top:32px;text-align:center;padding:32px 16px;color:var(--pencil)}.empty-state .empty-symbol{width:64px;height:64px;border-radius:20px;background:#e8edf5;display:grid;place-items:center;margin:0 auto 20px;color:#627da8}.empty-state svg{width:29px;height:29px}.empty-state h2{font-size:16px;font-weight:600;color:var(--ink);margin:0 0 9px}.empty-state p{font-size:12px;line-height:1.7;margin:0}.load-note{font-size:12px;color:var(--pencil);text-align:center;padding:14px}.session-title{font-size:13px;color:var(--pencil);margin:12px 0}
body{background:var(--paper)}.week{grid-template-columns:repeat(3,1fr)}.day b{font-size:16px}.app{max-width:none}.destination b{overflow-wrap:anywhere}nav{max-width:none;width:100%}</style><svg style="display:none" aria-hidden="true"><defs><symbol id="pin" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol><symbol id="scan" viewBox="0 0 24 24"><path d="M3 8V3h5m8 0h5v5M3 16v5h5m8 0h5v-5M7 7h3v3H7zM14 7h3v3h-3zM7 14h3v3H7zM14 14h3v3h-3z"/></symbol><symbol id="code" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 10v4m4-4v4m4-4v4m3-4v4"/></symbol><symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18m-14 4h3m4 0h3m-10 3h3"/></symbol><symbol id="record" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6m-6 4h6m-6 4h4"/></symbol><symbol id="leave" viewBox="0 0 24 24"><circle cx="10" cy="7" r="4"/><path d="M3 21v-3a7 7 0 0 1 10-6m3 2 3 3-3 3m-2-3h8"/></symbol></defs></svg>
<main class="app">
<header><div><div class="eyebrow">XJTLU / CAMPUS DAY</div><h1>今日课表</h1></div></header>
<div id="homeScreen"><div class="date-head"><strong id="month">2026 年 10 月</strong><button class="return" id="today">回到今天 ↗</button></div>
<div class="week" id="week" aria-label="选择课程日期"></div>
<section id="focus" aria-label="当前或下一节课程"></section>
<div class="actions"><button class="action" id="scanBtn"><svg><use href="#scan"/></svg>扫码签到</button><button class="action" id="codeBtn"><svg><use href="#code"/></svg>Code 签到</button></div>
<section aria-label="课程列表"><div class="section-title"><h2 id="listTitle">接下来的课</h2><span id="count"></span></div><div id="lessons"></div><div id="completed"></div></section>

</div><section id="otherScreen" hidden></section><nav aria-label="主导航"><button class="active" aria-current="page"><svg><use href="#calendar"/></svg>课表</button><button id="records"><svg><use href="#record"/></svg>签到记录</button><button id="leaveBtn"><svg><use href="#leave"/></svg>请假</button></nav>
</main><dialog id="sheet"><div id="sheetContent"></div><button class="close" id="close">关闭</button></dialog>
<script>
const icon=id=>`<svg aria-hidden="true"><use href="#${id}"/></svg>`;
let days=[], selected=0, ready=false,page={route:'/home'},draft='',busy=false;
const screens={};
function navigate(route,action){if(screens[route]){page=screens[route];render();}send(action);}
const mins=t=>Number(t.split(':')[0])*60+Number(t.split(':')[1]);
const escape=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const send=(action,extra={})=>parent.postMessage(Object.assign({amsUiAction:action},extra),'*');
document.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse'&&e.button!==0)return;
 const button=e.target.closest&&e.target.closest('button,summary');if(!button)return;
 const rect=button.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;
 const radius=Math.hypot(Math.max(x,rect.width-x),Math.max(y,rect.height-y));
 const ripple=document.createElement('span');ripple.className='tap-ripple';ripple.setAttribute('aria-hidden','true');
 ripple.style.cssText=`width:${radius*2}px;height:${radius*2}px;left:${x-radius}px;top:${y-radius}px`;
 button.appendChild(ripple);setTimeout(()=>ripple.remove(),400);
});
const rows=()=>days[selected]&&Array.isArray(days[selected].timetableVoList)?days[selected].timetableVoList:[];
function times(c){const matches=String(c.moduleTime||'').match(/\d{1,2}:\d{2}/g);return matches&&matches.length>=2?matches.slice(0,2):null;}
function show(content){document.getElementById('sheetContent').innerHTML=content;document.getElementById('sheet').showModal();}
function detail(i){const c=rows()[i];show(`<h2>${escape(c.moduleTitle)}</h2><dl><dt>时间</dt><dd>${escape(c.moduleTime||'未提供')}</dd><dt>教室</dt><dd>${escape(c.room||'学校暂未提供')}</dd><dt>课程编号</dt><dd>${escape(c.moduleCode||'—')}</dd><dt>教学组</dt><dd>${escape(c.moduleTypeGroup||'—')}</dd></dl>`);}
function card(c,i,ended=false){const t=times(c);const now=new Date();const n=now.getHours()*60+now.getMinutes();const state=ended?'已结束':selected===0&&t&&mins(t[0])<=n&&n<mins(t[1])?'进行中':'待上课';return `<article class="lesson"><div class="times">${escape(t?t[0]:'—')}<small>${escape(t?t[1]:'')}</small></div><button class="card" data-detail="${i}" aria-label="查看课程详情"><div class="card-top"><span>${escape(c.moduleCode||'')}</span><span class="state">${t?state:'时间待确认'}</span></div><h3>${escape(c.moduleTitle||'未命名课程')}</h3><div class="room">${icon('pin')}${escape(c.room||'地点待确认')}<span class="arrow">›</span></div></button></article>`;}
function renderHome(){const now=new Date(),n=now.getHours()*60+now.getMinutes();document.getElementById('month').textContent=now.getFullYear()+' 年 '+(now.getMonth()+1)+' 月';document.getElementById('week').innerHTML=[0,1,2].map(i=>`<button class="day ${selected===i?'selected':''}" data-date="${i}" aria-pressed="${selected===i}"><small>${['今天','明天','后天'][i]}</small><b>${escape(days[i]&&days[i].date&&days[i].date.trim()!=='-'?days[i].date:'待读取')}</b></button>`).join('');let all=rows().map((c,i)=>({c,i}));all.sort((a,b)=>{const x=times(a.c),y=times(b.c);return (x?mins(x[0]):Infinity)-(y?mins(y[0]):Infinity);});const valid=ready&&days[selected]&&days[selected].date&&days[selected].date.trim()!=='-'&&Array.isArray(days[selected].timetableVoList);const ended=selected===0?all.filter(x=>times(x.c)&&mins(times(x.c)[1])<=n):[];const remaining=all.filter(x=>!ended.includes(x));const next=remaining.find(x=>times(x.c));const t=next&&times(next.c);const active=selected===0&&t&&mins(t[0])<=n&&n<mins(t[1]);document.getElementById('focus').innerHTML=next?`<div class="hero"><div class="hero-top"><span>${active?'正在上课':selected===0?'下一节课':'当天第一节课'}</span><span>${selected===0?(active?'还有 '+(mins(t[1])-n)+' 分钟结束':(mins(t[0])-n)+' 分钟后开始'):escape(days[selected].date)}</span></div><h2>${escape(next.c.moduleTitle)}</h2><div class="hero-time">${escape(t[0])} — ${escape(t[1])}</div><div class="destination">${icon('pin')}<b>${escape(next.c.room||'地点待确认')}</b><span>上课地点</span></div>${active?`<div class="bar"><i style="width:${(n-mins(t[0]))/(mins(t[1])-mins(t[0]))*100}%"></i></div>`:''}</div>`:'';document.getElementById('listTitle').textContent=selected===0?'接下来的课':['今天','明天','后天'][selected]+'课程';document.getElementById('count').textContent=valid?all.length+' 节课'+(selected===0?' · 剩余 '+remaining.length+' 节':''):'尚未读取';document.getElementById('lessons').innerHTML=remaining.length?remaining.map(x=>card(x.c,x.i)).join(''):`<div class="empty">${icon('calendar')}<h2>${!valid?'正在读取学校课表':all.length?'今天的课都结束了':'当天没有课程'}</h2><p>${!valid?'暂未获取到数据，不代表当天没有课。':all.length?'今天辛苦了。':'学校返回的课表为空。'}</p></div>`;document.getElementById('completed').innerHTML=ended.length?`<details class="completed"><summary>今天已结束 · ${ended.length} 节课</summary>${ended.map(x=>card(x.c,x.i,true)).join('')}</details>`:'';document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.date);render();});document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(Number(b.dataset.detail)));}

function render(){
 const route=page.route||'/home',home=route==='/home';
 document.getElementById('homeScreen').hidden=!home;
 document.getElementById('otherScreen').hidden=home;
 document.querySelector('h1').textContent=home?'今日课表':route.startsWith('/course')?'签到记录':route==='/leave'?'请假':route==='/signCode'?'Code 签到':'签到结果';
 document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',i===(route.startsWith('/course')?1:route==='/leave'?2:0)));
 if(home){renderHome();return;}
 const list=page.list||[],screen=document.getElementById('otherScreen');
 const back='<button class="return" id="backHome">‹ 返回课表</button>';
 if(route==='/signCode')screen.innerHTML=back+`<div class="hero"><h2>输入课堂签到码</h2><p>提交后由学校验证，以返回结果为准。</p></div><form id="codeForm"><label for="codeValue">签到码</label><input id="codeValue" autocomplete="off" maxlength="20" required value="${escape(draft)}" placeholder="输入老师提供的 code" style="margin:12px 0"><button class="close" ${busy?'disabled':''}>${busy?'正在提交…':'提交签到'}</button></form>`;
 else if(route==='/course')screen.innerHTML=(page.loading?'<p>正在读取学校记录…</p>':'')+list.map((c,i)=>`<button class="card" data-record="${i}" style="margin-bottom:12px"><div class="card-top">${escape(c.moduleCode)}</div><h3>${escape(c.moudleTitle||c.moduleTitle)}</h3><div class="room">${escape(c.courseAttendance==null?'—':c.courseAttendance+'%')} <small>出勤率</small></div><p>总课时 ${escape(c.classHour)} · 已出勤 ${escape(c.signClassHour)}<br>缺勤 ${escape(c.absences)} · 请假 ${escape(c.leaveClassHour)}</p></button>`).join('')+(!page.loading&&!list.length?'<p>学校暂未返回记录，请稍后查看。</p>':'');
 else if(route==='/course/sessions'){
  const q=page.query||{},names=['待确认','已出勤','缺勤','已批准请假','不计入'];
  screen.innerHTML='<button class="return" id="backRecords">‹ 全部课程</button>'+`<p class="session-title">${escape(q.moduleCode||'课程')} · 出勤明细</p><div class="record-filters"><label>教学组<select id="groupFilter"><option value="">全部教学组</option>${(page.groups||[]).map(g=>`<option value="${escape(g.name)}" ${q.moduleTypeGroup===g.name?'selected':''}>${escape(g.name)}</option>`).join('')}</select></label><label>出勤状态<select id="statusFilter"><option value="">全部状态</option>${names.map((n,i)=>`<option value="${i}" ${String(q.status)===String(i)?'selected':''}>${n}</option>`).join('')}</select></label><label class="date-filter">上课日期<input type="date" id="dateFilter" value="${escape(q.date==='Time'?'':q.date||'')}"></label></div>`+list.map(c=>`<article class="session"><div class="session-head"><h3>${escape(c.moduleTypeGroup||q.moduleCode)}</h3><span class="badge ${Number(c.status)===1?'present':Number(c.status)===2?'absent':''}">${escape(names[Number(c.status)]||c.statusName||'待确认')}</span></div><p class="session-date">${escape(c.date)}</p><div class="session-foot"><span>${Number(c.status)===1?'签到于 '+escape(c.signTime||'—'):''}</span><span>${escape(({1:'扫码签到',2:'Code 签到',3:'教师确认',6:'未签到',7:'未签到'})[c.signWay]||'')}</span></div></article>`).join('')+(page.loading?'<p class="load-note">正在读取明细…</p>':!list.length?'<div class="empty-state"><h2>没有匹配的记录</h2><p>试试调整筛选条件</p></div>':!page.finished?'<button class="action" id="moreSessions" style="width:100%">加载更多</button>':'<p class="load-note">已显示全部记录</p>');
 }
 else if(route==='/leave')screen.innerHTML='<button class="action" id="applyLeave" style="width:100%;margin-bottom:20px">＋ 新建请假申请</button>'+(page.loading?'<p class="load-note">正在读取请假记录…</p>':'')+list.map((c,i)=>`<button class="card" data-leave="${i}" style="margin-bottom:12px"><div class="card-top"><span>${escape(c.leaveOdd)}</span><span>${Number(c.status)===2?'已完成':'待处理'}</span></div><h3>${escape(c.startDate)} 至 ${escape(c.endDate)}</h3><p>创建于 ${escape(c.createTime)}</p></button>`).join('')+(!page.loading&&!list.length?`<div class="empty-state"><div class="empty-symbol">${icon('leave')}</div><h2>暂无请假申请</h2><p>提交的申请会显示在这里</p></div>`:'');
 else if(route==='/signCodeSuccess')screen.innerHTML=back+`<div class="hero"><div class="hero-top">学校已返回签到成功</div><h2>签到成功</h2><p>${escape(page.signInfo&&page.signInfo.signTime||'')}</p></div>`;
 else if(route==='/signCodeFail')screen.innerHTML=back+`<div class="card"><h3>签到未成功</h3><p>${escape(page.reason||'请检查学校返回的信息')}</p><button class="close" id="retryCode">重新输入 code</button></div>`;
 else screen.innerHTML=back+'<p>正在加载…</p>';
 const backButton=document.getElementById('backHome');if(backButton)backButton.onclick=()=>navigate('/home','home');
