      panel.innerHTML = '<h3>2 · 选择座位</h3><p class="steps">选楼层与时段 → 查看座位位置 → 确认预约</p><p class="seat-summary" aria-live="polite"></p><div class="seat-controls"><button class="list-toggle" aria-pressed="true">座位列表</button><button class="overview-toggle" aria-pressed="false">在楼层图上选座</button></div><div class="availability"><button class="filter-toggle" aria-pressed="true">仅显示全程空闲</button><button class="all-toggle" aria-pressed="false">显示全部状态</button></div><p class="view-feedback" role="status" aria-live="polite">点击一个座位查看位置，再进入预约确认。</p><div class="seat-detail" hidden><strong class="seat-title"></strong><span class="selection-feedback" role="status" aria-live="polite"></span><button class="map-toggle" style="margin-left:8px">查看全层</button><canvas aria-label="所选座位在学校楼层地图中的位置"></canvas><small class="seat-notice" aria-live="polite"></small><button class="booking-toggle">下一步：确认预约</button></div><div class="overview" hidden><p class="map-legend">绿色 空闲 · 金色 部分空闲 · 灰色 不可选 · 蓝色 已选<br>点击座位查看位置，也可用列表按座位号选择。</p><canvas class="overview-canvas" aria-label="楼层全局座位空闲地图"></canvas></div><div class="list-view"><input aria-label="查找座位号" placeholder="搜索座位号，如 024"><div class="seat-list"></div></div><details><summary>学校原地图（兼容模式）</summary><button class="original-toggle">显示学校原地图</button></details>';
      area.before(panel); area.classList.add('campus-hide-map');
      panel.querySelector('input').oninput = list;
      function filter(on){availableOnly=on;panel.querySelector('.filter-toggle').setAttribute('aria-pressed',String(on));panel.querySelector('.all-toggle').setAttribute('aria-pressed',String(!on));list();drawOverview();panel.querySelector('.view-feedback').textContent=on?'现在仅显示所选时段全程空闲的座位。':'现在显示全部状态。部分空闲需在确认时选择可用时段。';}
      panel.querySelector('.filter-toggle').onclick=()=>filter(true);
      panel.querySelector('.all-toggle').onclick=()=>filter(false);
      panel.querySelector('.booking-toggle').onclick = booking;
      function changeView(on){panel.querySelector('.view-feedback').textContent=on?'已切换为楼层图。点击绿色座位查看位置。':'已切换为座位列表。可输入座位号搜索。';panel.querySelector('.overview').hidden=!on;panel.querySelector('.list-view').hidden=on;panel.querySelector('.overview-toggle').setAttribute('aria-pressed',String(on));panel.querySelector('.list-toggle').setAttribute('aria-pressed',String(!on));drawOverview();}
      panel.querySelector('.overview-toggle').onclick=()=>changeView(true);
      panel.querySelector('.list-toggle').onclick=()=>changeView(false);
      panel.querySelector('.map-toggle').onclick = () => { full = !full; draw(); };
      panel.querySelector('.original-toggle').onclick = () => { original = !original; area.classList.toggle('campus-hide-map', !original); panel.querySelector('.original-toggle').textContent = original ? '收起学校原地图' : '显示学校原地图'; };
    }
    const image = area.querySelector('.grid > img');
    const school=area.__vue__&&area.__vue__.$parent;
    const nextContext=school?JSON.stringify([school.dateValue,school.timeValue]):'';
    if(timeContext&&timeContext!==nextContext){selected='';checkingAt=0;panel.querySelector('.view-feedback').textContent='日期或时段已更改，请根据更新后的空闲状态重新选座。';panel.querySelector('.booking-toggle').textContent='下一步：确认预约';signature='';}
    timeContext=nextContext;
    const sig = location.hash + '|' + (image ? image.src + image.complete : '') + '|' + nodes().map(n => n.title + n.className + n.style.left + n.style.top).join(';');
    if (sig !== signature) { signature = sig; list(); draw(); drawOverview(); }
  }
  refresh(); let timer = setInterval(refresh, 1000);
  window.addEventListener('pagehide', () => { clearInterval(timer); timer = null; });
  window.addEventListener('pageshow', () => { if (!timer) { refresh(); timer = setInterval(refresh, 1000); } });
})();
</script>
